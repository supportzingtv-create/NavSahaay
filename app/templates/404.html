{% extends "base.html" %}

{% block title %}Page Not Found | NavSahaay Foundation{% endblock %}

{% block content %}
<section class="py-24 bg-slate-950 text-white min-h-[70vh] flex items-center justify-center">
    <div class="max-w-3xl mx-auto px-4 text-center">
        <span class="text-7xl font-black text-primary-500 font-serif block mb-2 drop-shadow-md">404</span>
        <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight text-white mb-4 font-serif">Page Not Found</h1>
        <p class="text-gray-300 text-sm md:text-base font-medium mb-8 leading-relaxed max-w-lg mx-auto">
            The page you are looking for might have been moved, updated, or is temporarily unavailable.
        </p>
        <div class="flex flex-wrap items-center justify-center gap-4">
            <a href="{{ url_for('main.home') }}" class="inline-flex items-center justify-center px-8 py-4 bg-primary-600 hover:bg-primary-700 text-white rounded-full font-black text-xs uppercase tracking-widest shadow-xl transition-all hover:scale-105">
                Back to Homepage
            </a>
            <a href="{{ url_for('main.gallery') }}" class="inline-flex items-center justify-center px-8 py-4 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-full font-black text-xs uppercase tracking-widest transition-all">
                Explore Photo Gallery
            </a>
        </div>
    </div>
</section>
{% endblock %}
