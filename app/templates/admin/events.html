{% extends "admin/base.html" %}{% block admin_content %}<h1>Events <a class="btn small" href="{{url_for('admin.new_event')}}">+ New Event</a></h1><table><tr><th>Date</th><th>Title</th><th>Cause</th><th>Location</th><th>Action</th></tr>{% for e in events %}<tr><td>{{e.event_date}}</td><td>{{e.title}}</td><td>{{e.cause}}</td><td>{{e.location}}</td><td><form method="post" action="{{url_for('admin.delete_event',id=e.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
