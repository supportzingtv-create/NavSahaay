{% extends "admin/base.html" %}{% block admin_content %}<h1>Volunteers</h1><table><tr><th>Reference</th><th>Name</th><th>Email</th><th>Interest</th><th>Status</th><th>Update</th></tr>{% for v in volunteers %}<tr><td>{{v.reference_id}}</td><td>{{v.name}}</td><td>{{v.email}}</td><td>{{v.interest}}</td><td>{{v.status}}</td><td><form method="post" action="{{url_for('admin.volunteer_status',id=v.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="status"><option>NEW</option><option>CONTACTED</option><option>APPROVED</option><option>REJECTED</option></select><button>Save</button></form></td></tr>{% endfor %}</table>{% endblock %}
