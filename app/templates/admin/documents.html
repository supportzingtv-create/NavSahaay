{% extends "admin/base.html" %}{% block admin_content %}<h1>Documents</h1><form class="card form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" required></label><label>Category<input name="category" required></label><label>Description<textarea name="description"></textarea></label><label>PDF/document<input type="file" name="file" required></label><button class="btn">Upload</button></form><table><tr><th>Title</th><th>Category</th><th>File</th></tr>{% for d in documents %}<tr><td>{{d.title}}</td><td>{{d.category}}</td><td><a href="{{url_for('admin.download_document',id=d.id)}}">Download</a></td></tr>{% endfor %}</table>{% endblock %}
